<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Deck — Character Pull v9</title>
<style>
:root{--bg1:#10172c;--bg2:#251b45;--glow1:#6545a0;--glow2:#176077;--gold:#e8c56d;--ink:#171a2c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:30px 16px;color:#f5f1ff;overflow-x:hidden;
 background:radial-gradient(ellipse at 12% 18%,var(--glow1),transparent 34%),radial-gradient(ellipse at 88% 82%,var(--glow2),transparent 34%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;transition:background .8s}
body:before{content:"";position:fixed;inset:-30%;pointer-events:none;opacity:.20;background:radial-gradient(circle,#fff 1px,transparent 1.5px);background-size:28px 28px;animation:drift 24s linear infinite}
body:after{content:"";position:fixed;width:70vmax;height:70vmax;border:1px solid #ffffff12;border-radius:50%;pointer-events:none;animation:orb 28s ease-in-out infinite alternate}
.ambient-motion{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;isolation:isolate}
.ambient-motion:before,.ambient-motion:after{content:"";position:absolute;width:58vmax;height:58vmax;border-radius:50%;filter:blur(65px);opacity:.22;mix-blend-mode:screen;will-change:transform}
.ambient-motion:before{left:-20vmax;top:-18vmax;background:radial-gradient(circle at 45% 45%,var(--glow1),transparent 67%);animation:nebulaOne 19s ease-in-out infinite alternate}
.ambient-motion:after{right:-22vmax;bottom:-22vmax;background:radial-gradient(circle at 50% 50%,var(--glow2),transparent 68%);animation:nebulaTwo 24s ease-in-out infinite alternate}
@keyframes nebulaOne{0%{transform:translate3d(0,0,0) scale(.82)}50%{transform:translate3d(18vw,14vh,0) scale(1.16)}100%{transform:translate3d(7vw,30vh,0) scale(1.02)}}
@keyframes nebulaTwo{0%{transform:translate3d(0,0,0) scale(1.08)}50%{transform:translate3d(-19vw,-13vh,0) scale(.84)}100%{transform:translate3d(-5vw,-28vh,0) scale(1.14)}}
@keyframes drift{to{transform:translate3d(3%,2%,0) rotate(18deg)}}
@keyframes orb{from{transform:translate(-15vw,-7vh) scale(.8)}to{transform:translate(18vw,12vh) scale(1.12)}}
.app{width:min(100%,500px);position:relative;z-index:1}
.card{position:relative;overflow:hidden;padding:13px;border-radius:23px;color:var(--ink);background:linear-gradient(145deg,#fff7dd,#e8d9ad 52%,#fff2cb);border:2px solid #fff0bd;box-shadow:0 28px 80px #0008,0 0 35px #d6b6ff25;isolation:isolate}
.card:before{content:"";position:absolute;inset:6px;border:1px solid #b99c5c;border-radius:15px;pointer-events:none;z-index:5}
.card:after{content:"";position:absolute;width:180px;height:180px;right:-85px;top:-90px;border:1px solid #b99c5c66;border-radius:50%;box-shadow:0 0 0 12px #b99c5c12,0 0 0 24px #b99c5c0c;pointer-events:none;z-index:0}
.topline{position:relative;display:flex;justify-content:flex-end;align-items:center;padding:4px 6px 11px;z-index:6}
.label{font-size:9px;font-weight:1000;letter-spacing:.2em;color:#6f5a31}
.rarity{font-size:9px;font-weight:1000;letter-spacing:.12em;color:#39254f;background:linear-gradient(90deg,#f6df92,#fff1c2);border:1px solid #c5a75e;padding:6px 10px;border-radius:20px}
.rarity.mythic{background:linear-gradient(110deg,#e8b8ff,#fff4a6,#9cecff,#e8b8ff);background-size:220%;animation:rarityshine 5s linear infinite}
.rarity.legendary{background:linear-gradient(110deg,#fff0a8,#d9a73f,#fff4c5)}
.rarity.epic{background:linear-gradient(110deg,#d9c5ff,#9e80d9,#f2e5ff)}
@keyframes rarityshine{to{background-position:220% 0}}
.portrait{height:390px;position:relative;overflow:hidden;border-radius:13px;display:grid;place-items:center;isolation:isolate;background:radial-gradient(circle at 50% 42%,#ffffff55,transparent 38%),linear-gradient(145deg,var(--c1,#7452a8),var(--c2,#172b58));border:3px solid #fdf0c7;box-shadow:inset 0 0 0 1px #fff8}
.portrait:before{content:"";position:absolute;inset:-30%;opacity:.22;z-index:0;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 8deg,#fff 8.3deg 8.8deg,transparent 9deg 18deg)}
.portrait:after{content:"";position:absolute;width:240px;height:240px;border:1px solid #ffffff55;border-radius:50%;box-shadow:0 0 0 15px #ffffff10,0 0 0 32px #ffffff08;z-index:0}
.character-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;z-index:1;filter:saturate(1.1) contrast(1.04)}
.sigil{font-size:112px;filter:drop-shadow(0 12px 9px #10152b66);z-index:1}
.foil{display:none}
@keyframes foilshift{0%,100%{background-position:100% 0;opacity:.1}50%{background-position:0 100%;opacity:.3}}
.battle-stats{display:flex;gap:7px;margin:9px 5px 0;position:relative;z-index:4}
.battle-stat{flex:1;text-align:center;border:1px solid #c8a95f;border-radius:7px;padding:7px 4px;background:linear-gradient(145deg,#fff8df,#e9d49b);color:#45351d}
.battle-stat b{display:block;font:900 8px system-ui;letter-spacing:.13em}
.battle-stat strong{display:block;font:900 17px Georgia,serif;margin-top:2px}
.identity{position:relative;padding:14px 6px 7px;z-index:4}
.series{color:#82652e;font-size:9px;font-weight:1000;letter-spacing:.2em;text-transform:uppercase}
h1{font:700 31px/1.04 Georgia,"Times New Roman",serif;margin:5px 0 4px;letter-spacing:-.04em}
.role{color:#68677a;font-size:11px}
.quote-box{position:relative;margin:12px 0 12px;padding:15px 15px 13px;background:linear-gradient(135deg,#fff9e9,#f4e9ce);border-left:4px solid #c99d3d;border-radius:5px 12px 12px 5px;z-index:4;min-height:88px}
.quote-mark{color:#c99d3d;font:38px Georgia,serif;line-height:.6}
blockquote{margin:6px 0 0;font:italic 16px/1.36 Georgia,"Times New Roman",serif;color:#24253a}
.bottomline{border-top:1px solid #d8c89e;padding:10px 6px 3px;min-height:16px}
.serial{display:block;text-align:right;font:12px Georgia,serif;color:#7a6949}
.controls{display:flex;gap:12px;margin-top:17px}
button{flex:1;border:1px solid #ffffff30;border-radius:11px;padding:14px 16px;font-size:12px;font-weight:900;letter-spacing:.08em;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 9px 24px #0005}
button:disabled{opacity:.55;cursor:wait;transform:none}
#refresh{color:#fff;background:linear-gradient(120deg,#6d4ac1,#3d3b86)}
#print{color:#211a37;background:linear-gradient(120deg,#ffe59b,#e9bc52);border-color:#fff0bf}
.hint{text-align:center;color:#c4bdd9;font-size:10px;margin:11px 0 0}
#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:#080b18eF;backdrop-filter:blur(13px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#loader.active{opacity:1;visibility:visible}
.loader-inner{padding:25px}
.element-symbol{font-size:78px;display:block;filter:drop-shadow(0 0 24px var(--element-glow,#fff));animation:elementpulse 1.2s ease-in-out infinite alternate}
.loader-title{margin-top:17px;font-size:12px;font-weight:1000;letter-spacing:.3em}
.loader-sub{margin-top:9px;color:#d9d1ef;font:italic 14px Georgia,serif}
.loader-track{height:3px;width:190px;margin:22px auto 0;background:#ffffff30;overflow:hidden;border-radius:5px}
.loader-track:after{content:"";display:block;height:100%;width:42%;background:linear-gradient(90deg,#7ce8ff,#f2c5ff,#ffe08a);animation:loadbar 1.1s ease-in-out infinite}
@keyframes elementpulse{to{transform:scale(1.12) rotate(8deg);filter:drop-shadow(0 0 35px var(--element-glow,#fff))}}
@keyframes loadbar{from{transform:translateX(-110%)}to{transform:translateX(350%)}}
.reveal{animation:reveal .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{0%{opacity:0;transform:translateY(24px) scale(.94);filter:brightness(2.2) saturate(1.8)}55%{opacity:1;filter:brightness(1.3) saturate(1.3)}100%{opacity:1;transform:none;filter:none}}
.card.element-fire{animation:fireReveal .95s ease both}
.card.element-water{animation:waterReveal .95s ease both}
.card.element-earth{animation:earthReveal .95s ease both}
.card.element-air{animation:airReveal .95s ease both}
.card.element-lightning{animation:lightningReveal .75s ease both}
@keyframes fireReveal{0%{box-shadow:0 0 0 0 #ff6a2a00;filter:brightness(1.8)}35%{box-shadow:0 0 55px 8px #ff6a2a88}100%{filter:none}}
@keyframes waterReveal{0%{clip-path:inset(0 50% 100% 50%);filter:blur(8px)}100%{clip-path:inset(0 0 0 0);filter:none}}
@keyframes earthReveal{0%{transform:translateY(35px) scale(.95);filter:contrast(1.5)}65%{transform:translateY(-5px)}100%{transform:none;filter:none}}
@keyframes airReveal{0%{opacity:0;transform:translateY(-28px) scale(1.04);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
@keyframes lightningReveal{0%{opacity:0;filter:brightness(3)}25%{opacity:1;filter:brightness(1.5)}40%{opacity:.55}60%{opacity:1;filter:brightness(1.7)}100%{filter:none}}
@media(max-width:420px){body{padding:18px 12px}.portrait{height:340px}h1{font-size:27px}blockquote{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
@media print{
 @page{size:A5 portrait;margin:6mm}
 html,body{background:#fff!important;min-height:0;padding:0;display:block;color:#111;print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
 body:before,body:after,.ambient-motion,.controls,.hint,#loader{display:none!important}
 .app{width:100%;max-width:none}
 .card{height:185mm;min-height:0;box-shadow:none!important;border:0!important;outline:0!important;border-radius:12px;background:#fff2cb!important;overflow:hidden;break-inside:avoid;filter:none!important;animation:none!important}
 .character-art{filter:none!important}
 .portrait{outline:0!important}
 .card:before,.card:after{display:none!important}
 .topline,.identity,.battle-stats,.quote-box,.bottomline,.portrait{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
 .portrait{height:91mm;box-shadow:none!important}
 .foil{display:none!important}
 .rarity,.battle-stat,.quote-box{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
 .identity{padding-top:10px}
 h1{font-size:27px}
 .quote-box{background:#f4e9ce!important}
}
</style>
</head>
<body>
<div class="ambient-motion" aria-hidden="true"></div>
<main class="app">
 <article class="card" id="card" aria-live="polite">
  <div class="topline"><span class="rarity rare" id="rarity">★ RARE</span></div>
  <section class="portrait" id="portrait">
   <img class="character-art" id="characterArt" alt="Anime character artwork" hidden>
   <div class="sigil" id="sigil">🌌</div><div class="foil"></div>
  </section>
  <div class="battle-stats">
   <div class="battle-stat"><b>ATK</b><strong id="attack">000</strong></div>
   <div class="battle-stat"><b>DEF</b><strong id="defense">000</strong></div>
   <div class="battle-stat"><b>SPECIAL</b><strong id="special">000</strong></div>
  </div>
  <section class="identity"><div class="series" id="series">ANIME</div><h1 id="name">Finding a character…</h1><div class="role" id="role" hidden></div></section>
  <section class="quote-box"><div class="quote-mark">“</div><blockquote id="quote">A new character is waiting to be discovered.</blockquote></section>
  <div class="bottomline"><span class="serial" id="serial"></span></div>
 </article>
 <div class="controls"><button id="refresh" type="button">↻ &nbsp; NEW CARD</button><button id="print" type="button">⇩ &nbsp; PRINT / PDF</button></div>
 <p class="hint" id="hint">Discover characters from across the anime multiverse.</p>
</main>
<div id="loader" class="active" aria-live="polite">
 <div class="loader-inner"><span class="element-symbol" id="elementSymbol">🌊</span><div class="loader-title" id="loaderTitle">OPENING THE PORTAL</div><div class="loader-sub" id="loaderSub">Searching the anime multiverse…</div><div class="loader-track"></div></div>
</div>
<script>
const API="https://jikan.lucashdo.com/v1";
const elements=[
 {name:"WATER",symbol:"🌊",glow:"#5ecbff",scene:"WATER",cls:"water"},
 {name:"FIRE",symbol:"🔥",glow:"#ff784e",scene:"FIRE",cls:"fire"},
 {name:"EARTH",symbol:"🌿",glow:"#8bd47b",scene:"EARTH",cls:"earth"},
 {name:"AIR",symbol:"🌪️",glow:"#d5e9ff",scene:"AIR",cls:"air"},
 {name:"LIGHTNING",symbol:"⚡",glow:"#fff078",scene:"LIGHTNING",cls:"lightning"}
];
const palettes=[
 ["#11142c","#281b48","#643b9b","#155c75"],
 ["#101b2c","#182e3b","#1e7181","#9a4b36"],
 ["#21132d","#451c36","#a83d6c","#d08b3e"],
 ["#111b24","#203b34","#377e69","#a48b42"],
 ["#17172e","#34265b","#6354b7","#3c6da0"],
 ["#211a19","#49301f","#b66b35","#70435d"]
];
let previousId=null,requestId=0, audioCtx=null, ambientNodes=null, soundEnabled=false;
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function atmosphere(){
 const p=pick(palettes),root=document.documentElement;
 ["--bg1","--bg2","--glow1","--glow2"].forEach((k,i)=>root.style.setProperty(k,p[i]));
 $("portrait").style.setProperty("--c1",p[2]);$("portrait").style.setProperty("--c2",p[3]);
}
function startAudio(){
 if(!soundEnabled)return;
 try{
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  if(!ambientNodes){
   const now=audioCtx.currentTime;
   const master=audioCtx.createGain();master.gain.setValueAtTime(0,now);master.gain.linearRampToValueAtTime(.72,now+2.5);master.connect(audioCtx.destination);
   const pad=audioCtx.createGain();pad.gain.value=.018;pad.connect(master);
   const filter=audioCtx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=260;filter.Q.value=.7;filter.connect(pad);
   const a=audioCtx.createOscillator(),b=audioCtx.createOscillator(),c=audioCtx.createOscillator();
   a.type="sine";b.type="triangle";c.type="sine";a.frequency.value=55;b.frequency.value=82.4;c.frequency.value=110;
   a.connect(filter);b.connect(filter);c.connect(filter);a.start();b.start();c.start();
   const lfo=audioCtx.createOscillator(),lfoGain=audioCtx.createGain();lfo.frequency.value=.07;lfoGain.gain.value=13;lfo.connect(lfoGain);lfoGain.connect(filter.frequency);lfo.start();
   const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),channel=buffer.getChannelData(0);
   for(let i=0;i<channel.length;i++)channel[i]=(Math.random()*2-1)*.22;
   const noise=audioCtx.createBufferSource();noise.buffer=buffer;noise.loop=true;
   const windFilter=audioCtx.createBiquadFilter();windFilter.type="lowpass";windFilter.frequency.value=380;
   const windGain=audioCtx.createGain();windGain.gain.value=.11;noise.connect(windFilter);windFilter.connect(windGain);windGain.connect(master);noise.start();
   ambientNodes={master,a,b,c,lfo,noise};
  }
 }catch(e){console.warn("Ambient audio unavailable",e)}
}
function tone(freq,duration,type="sine",volume=.07){
 if(!soundEnabled||!audioCtx)return;
 try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}
}
function loadingSound(){tone(220,.35,"sine",.035);setTimeout(()=>tone(330,.45,"sine",.025),140)}
function revealSound(el){const notes=el.cls==="fire"?[220,330,440]:el.cls==="water"?[392,523,659]:el.cls==="earth"?[130,196,261]:el.cls==="air"?[440,587,784]:[330,660,990];notes.forEach((n,i)=>setTimeout(()=>tone(n,.5,i===2?"triangle":"sine",.055),i*95))}
function setLoader(el){
 $("elementSymbol").textContent=el.symbol;$("elementSymbol").style.setProperty("--element-glow",el.glow);
 $("loaderTitle").textContent="SUMMONING "+el.name;
 $("loaderSub").textContent=pick(["A new legend is emerging…","The deck is searching across worlds…","Only characters with artwork can enter…","Your next pull is taking shape…"]);
 $("loader").classList.add("active");$("refresh").disabled=true;
 loadingSound();
}
function closeLoader(){ $("loader").classList.remove("active");$("refresh").disabled=false; }
function imgUrl(item){
 return item?.imageUrl||item?.images?.large||item?.images?.medium||item?.images?.small||item?.image_url||item?.images?.jpg?.image_url||item?.images?.webp?.image_url||null;
}
function idOf(item){return item?.malId??item?.mal_id??item?.id??null}
function nameOf(item){return item?.name||item?.nameKanji||item?.name_kanji||"Unknown character"}
function normal(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let cataloguePage=1,catalogueHasNext=true;
async function jsonFetch(url,ms=10000,retries=2){
 let attempt=0;
 while(true){
  let r;
  try{
   r=await fetch(url,{signal:AbortSignal.timeout(ms),headers:{Accept:"application/json"}});
  }catch(e){
   if(attempt<retries){await sleep(700*(attempt+1));attempt++;continue;}
   throw Error("Network request failed: "+(e?.message||"connection error"));
  }
  if(r.status===429&&attempt<retries){
   const retryAfter=Math.max(1,Math.min(60,Number(r.headers.get("Retry-After"))||10));
   await sleep(retryAfter*1000);attempt++;continue;
  }
  let body;
  try{body=await r.json()}catch(e){throw Error("API returned an unreadable response (HTTP "+r.status+")");}
  if(!r.ok){
   const apiError=body?.error;
   const message=apiError?.message||("API request failed with HTTP "+r.status);
   const code=apiError?.code?(" ["+apiError.code+"]"):"";
   const request=apiError?.requestId?(" Request ID: "+apiError.requestId):"";
   throw Error(message+code+request);
  }
  if(body?.error)throw Error(body.error.message||"API returned an error");
  // meta.stale is a valid cached fallback and must not be rejected.
  return body;
 }
}
function shuffle(list){
 const a=[...list];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
 return a;
}
async function getCharacterAnimeography(id){
 // Top-character ranking entries are intentionally lean and do not include animeography.
 // Fetch the dedicated character anime endpoint to discover the series this character appears in.
 const payload=await jsonFetch(API+"/characters/"+encodeURIComponent(id)+"/anime",9000,1);
 const entries=Array.isArray(payload.data)?payload.data:[];
 return entries.map(entry=>{
  const anime=entry?.anime||entry?.entry||entry;
  return {name:anime?.name||anime?.title||anime?.titleEnglish||anime?.titleJapanese||"",title:anime?.title||anime?.name||""};
 }).filter(entry=>entry.name||entry.title);
}
async function getRandomCharacter(){
 // Top characters is the paginated MAL catalogue (50 entries/page).
 // Pagination lives under meta.pagination; total is intentionally null.
 const maxPagesPerPull=4;
 for(let pageAttempt=0;pageAttempt<maxPagesPerPull;pageAttempt++){
  if(!catalogueHasNext&&cataloguePage>1){cataloguePage=1;catalogueHasNext=true;}
  const page=cataloguePage;
  const payload=await jsonFetch(API+"/top/characters?page="+page);
  const pagination=payload.meta?.pagination||{};
  const list=Array.isArray(payload.data)?payload.data:[];
  catalogueHasNext=Boolean(pagination.hasNextPage);
  cataloguePage=catalogueHasNext?page+1:1;
  if(!list.length){
   if(!catalogueHasNext)break;
   continue;
  }
  const candidates=shuffle(list);
  for(const item of candidates){
   const id=idOf(item);
   if(!id||id===previousId)continue;
   const main=imgUrl(item);
   if(main){
    const loaded=await preload(main,6500);
    if(loaded){
     previousId=id;
     try{item.anime=await getCharacterAnimeography(id)}catch(error){console.warn("Character animeography unavailable",id,error)}
     return {item,image:loaded,id};
    }
   }
   // Some character records have no usable main image. Check the picture gallery.
   // Keep gallery lookups limited to avoid exhausting the API's per-IP rate limit.
   if(candidates.indexOf(item)<4){
    try{
     const gallery=await jsonFetch(API+"/characters/"+id+"/pictures",8000,1);
     const pictures=Array.isArray(gallery.data)?gallery.data:[];
     for(const url of shuffle(pictures.map(imgUrl).filter(Boolean)).slice(0,5)){
      const loaded=await preload(url,6500);
      if(loaded){
       previousId=id;
       try{item.anime=await getCharacterAnimeography(id)}catch(error){console.warn("Character animeography unavailable",id,error)}
       return {item,image:loaded,id};
      }
     }
    }catch(error){
     if(/429|RATE_LIMITED/i.test(error.message))throw error;
    }
   }
  }
 }
 throw Error("No character with verified artwork was found on the next catalogue pages. Try another pull.");
}
function preload(url,timeout=6000){
 return new Promise(resolve=>{
  const img=new Image();let settled=false;
  const done=v=>{if(!settled){settled=true;resolve(v)}};
  img.onload=()=>done(url);img.onerror=()=>done(null);img.referrerPolicy="no-referrer";img.src=url;
  setTimeout(()=>done(null),timeout);
 });
}
function rarityFor(item){
 const f=Number(item.favorites||0);
 if(f>30000)return "MYTHIC";if(f>10000)return "LEGENDARY";if(f>2500)return "EPIC";if(f>500)return "RARE";return "COMMON";
}
const quoteCache=new Map();
function seriesOf(item){
 const entries=Array.isArray(item?.anime)?item.anime:[];
 const first=entries.find(x=>x?.name||x?.title||x?.titleEnglish||x?.titleJapanese);
 return first?.name||first?.title||first?.titleEnglish||first?.titleJapanese||"";
}
function normalTitle(value){return String(value||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g,"")}
async function getSeriesQuote(series){
 if(!series)return null;
 const key=normalTitle(series);
 if(quoteCache.has(key))return quoteCache.get(key);
 const url="https://api.animechan.io/v1/quotes/random?anime="+encodeURIComponent(series);
 try{
  const response=await fetch(url,{signal:AbortSignal.timeout(9000),headers:{Accept:"application/json"}});
  if(!response.ok)throw Error("Quote API HTTP "+response.status);
  const payload=await response.json(),q=payload?.data;
  const returnedAnime=normalTitle(q?.anime?.name);
  if(payload?.status!=="success"||!q?.content||!returnedAnime||!(returnedAnime===key||returnedAnime.includes(key)||key.includes(returnedAnime)))throw Error("No matching quote found for "+series);
  const result={content:String(q.content).trim(),anime:q.anime.name};
  quoteCache.set(key,result);return result;
 }catch(error){console.warn("Anime quote unavailable for "+series,error);quoteCache.set(key,null);return null;}
}
async function loadSeriesQuote(series,version){
 const quote=await getSeriesQuote(series);
 if(version!==requestId)return;
 $("quote").textContent=quote?quote.content:"No quote is available for this series right now.";
}
function reveal(data,el,version){
 if(version!==requestId)return;
 const c=data.item,rarity=rarityFor(c),id=data.id,series=seriesOf(c);
 $("characterArt").src=data.image;$("characterArt").hidden=false;$("sigil").hidden=true;
 $("name").textContent=nameOf(c);
 $("series").textContent=series||"ANIME SERIES UNKNOWN";
 $("role").hidden=true;$("role").textContent="";
 $("quote").textContent=series?"Searching for a quote from this series…":"Anime series information unavailable.";
 $("rarity").textContent="★ "+rarity;$("rarity").className="rarity "+rarity.toLowerCase();
 $("attack").textContent=600+Math.floor(Math.random()*401);
 $("defense").textContent=600+Math.floor(Math.random()*401);
 $("special").textContent=700+Math.floor(Math.random()*301);
 $("serial").textContent="No. "+String(id).padStart(5,"0");
 $("hint").textContent="A new discovery from the anime character catalogue.";
 $("card").className="card element-"+el.cls;
 atmosphere();closeLoader();revealSound(el);
 if(series)loadSeriesQuote(series,version);
 setTimeout(()=>{$("card").className="card"},1100);
}
async function showCard(){
 const version=++requestId,el=pick(elements);
 atmosphere();setLoader(el);
 try{
  const data=await getRandomCharacter();
  reveal(data,el,version);
 }catch(error){
  console.error("Character catalogue error:",error);
  if(version===requestId){
   closeLoader();$("hint").textContent="Character database is temporarily unavailable. Try again in a moment.";
   $("name").textContent="Connection interrupted";$("series").textContent="ANIME DATABASE";
   $("role").textContent="";$("role").hidden=true;
   $("quote").textContent="No image, no card. Your collection only accepts illustrated characters.";
   $("characterArt").hidden=true;$("sigil").hidden=false;$("sigil").textContent="🌌";
  }
 }
}
$("refresh").addEventListener("click",()=>{soundEnabled=true;startAudio();showCard()});
$("print").addEventListener("click",()=>window.print());
showCard();
</script>
